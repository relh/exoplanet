[project]
name = "exoplanet-search"
version = "0.1.0"
description = "Reproducible, exploratory TESS transit screening"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "scipy>=1.14", "astropy>=7", "requests>=2.32", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exoplanet"]

[project.scripts]
exoplanet-search = "exoplanet.pipeline:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
